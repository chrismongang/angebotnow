# .github/workflows/ci.yml
name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      # Mock environment variables for build testing
      DATABASE_URL: "postgresql://mock:mock@localhost:5432/mock"
      OPENAI_API_KEY: "mock-key-for-testing"
      USE_OPENAI: "false"
      CLOUDINARY_CLOUD_NAME: "mock-cloud"
      CLOUDINARY_API_KEY: "mock-key"
      CLOUDINARY_API_SECRET: "mock-secret"
      SENTRY_DSN: "https://mock@sentry.io/mock"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test --if-present

